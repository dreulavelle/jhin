name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # minimum supported (go.mod) and latest stable
        go: ["1.24.x", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzPrefilterEquivalence -fuzztime=15s ./parser/
      - name: Benchmark (smoke)
        run: go test -bench=. -benchmem -benchtime=1x -run='^$' ./...
