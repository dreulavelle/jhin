name: CI

on:
  push:
    branches: [main]
    paths: &code-paths
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "parser/keywords/**"
      - "parser/testdata/**"
      - ".golangci.yml"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *code-paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the declared go.mod floor, and latest stable — the two versions
        # jhin actually promises to work on
        go: ["1.24.x", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test -race -shuffle=on ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzPrefilterEquivalence -fuzztime=30s ./parser/
      - name: Fuzz rules (smoke)
        run: |
          go test -run='^$' -fuzz=FuzzCompile -fuzztime=30s ./rules/
          go test -run='^$' -fuzz=FuzzTextForm -fuzztime=30s ./rules/
      - name: Benchmark (smoke)
        run: go test -bench=. -benchmem -benchtime=1x -run='^$' ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Cross-compile (32-bit)
        # int is 32 bits here, so a constant fine on amd64 can refuse to build
        run: GOOS=linux GOARCH=386 go build ./... && GOOS=linux GOARCH=arm go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - name: Validate GoReleaser Config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: check
