name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # Requires: Settings → Actions → General → Workflow permissions →
      # "Allow GitHub Actions to create and approve pull requests"
      - name: Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: ${{ steps.release.outputs['release_created'] }}
        uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Setup Go
        if: ${{ steps.release.outputs['release_created'] }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and Release Artifact
        if: ${{ steps.release.outputs['release_created'] }}
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases are immutable once published, so release-please creates a
      # draft, goreleaser attaches binaries to it, and this publishes it.
      - name: Publish Release
        if: ${{ steps.release.outputs['release_created'] }}
        run: gh release edit "${{ steps.release.outputs['tag_name'] }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
