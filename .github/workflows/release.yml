name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases are immutable: assets exist only if attached at publish time, so
# goreleaser must be the publisher. release-please maintains the version PR,
# changelog, and a draft release carrying the notes; this workflow pushes the
# tag and goreleaser adopts the draft (use_existing_draft), uploads binaries,
# and publishes atomically. A botched immutable release burns its tag name
# forever — the rollback path is a `retract` directive plus a patch release.
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release PR / Version
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write # Close Stale Release PR
      issues: write # PR close comment is an issue comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push Tag
        run: |
          git tag "${{ needs.release-please.outputs.tag_name }}" "${{ needs.release-please.outputs.sha }}" || true
          git push origin "${{ needs.release-please.outputs.tag_name }}"

      # release-please computes the next release PR before this job pushes
      # the tag, so that PR is drafted against a missing tag and lists
      # already-released history. Discard it immediately after the tag
      # exists — the next releasable push regenerates a correct one. Runs
      # before the build steps so a later failure can't leave it behind.
      - name: Close Stale Release PR
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --head release-please--branches--main --json number --jq '.[].number'); do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded: drafted before the ${{ needs.release-please.outputs.tag_name }} tag existed; a correct PR will be generated on the next releasable commit." ||
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Test Tagged Commit
        run: git checkout "${{ needs.release-please.outputs.tag_name }}" && go test ./...

      - name: Build and Publish Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # avoids proxy.golang.org's negative-cache window and triggers
      # pkg.go.dev indexing before any user fetches the new version
      - name: Warm Module Proxy
        run: |
          cd "$(mktemp -d)"
          go mod init warm
          GOPROXY=https://proxy.golang.org go mod download "github.com/dreulavelle/jhin@${{ needs.release-please.outputs.tag_name }}" || true

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ./dist/checksums.txt
