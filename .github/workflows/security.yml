name: Security

on:
  push:
    branches: [main]
    paths: &code-paths
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths: *code-paths
  schedule:
    - cron: "0 6 * * 1" # weekly: vulns are published after code ships

# A superseded push should not hold a runner. main is exempt: every commit
# that can be released keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...
